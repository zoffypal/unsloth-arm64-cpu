name: Build Unsloth ARM64 Lite

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/unsloth-arm64:latest
            ghcr.io/${{ github.repository_owner }}/unsloth-arm64:cpu

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------
      # Basic ARM64 smoke test
      # ---------------------------------------------------

      - name: Test image
        run: |
          set -e
      
          IMAGE="ghcr.io/${{ github.repository_owner }}/unsloth-arm64:latest"
      
          echo "=== Architecture ==="
      
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -lc 'uname -m'
      
          echo "=== Python ==="
      
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -lc '/opt/unsloth-studio/unsloth_studio/bin/python --version'
      
          echo "=== Verify no PyTorch ==="
      
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -lc '! /opt/unsloth-studio/unsloth_studio/bin/python -c "import torch"'
      
          echo "=== Verify Studio dependencies ==="
      
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -lc '
              /opt/unsloth-studio/unsloth_studio/bin/python -c "
              import structlog
              import fastapi
              import uvicorn
              import pandas
              import matplotlib
              import gguf
              import av
              print(\"Studio dependencies OK\")
              "
            '
      
          echo "=== Verify CLI ==="
      
          docker run --rm \
            --entrypoint /opt/unsloth-studio/unsloth_studio/bin/unsloth \
            "$IMAGE" \
            --help
