name: Build Unsloth ARM64 Lite

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/unsloth-arm64:latest
            ghcr.io/${{ github.repository_owner }}/unsloth-arm64:cpu

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------
      # Basic ARM64 smoke test
      # ---------------------------------------------------

      - name: Test image
        run: |
          docker run -d \
            --name unsloth-test \
            -e UNSLOTH_STUDIO_PASSWORD=testpassword \
            -p 8000:8000 \
            ghcr.io/${{ github.repository_owner }}/unsloth-arm64:latest

          echo "Waiting for Studio..."

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "Studio is ready"
              break
            fi

            sleep 2
          done

          curl -f http://127.0.0.1:8000/

          docker exec unsloth-test \
            python3 --version

          docker exec unsloth-test \
            uname -m

          docker logs unsloth-test --tail 100
