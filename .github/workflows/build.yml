name: Build minimal Unsloth ARM64 CPU image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/unsloth-arm64-cpu

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: unsloth-arm64-cpu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -eux

          docker run --rm unsloth-arm64-cpu:test python - <<'PY'
          import platform
          import torch
          import unsloth

          print('machine:', platform.machine())
          print('torch:', torch.__version__)
          print('cuda_available:', torch.cuda.is_available())
          print('unsloth:', getattr(unsloth, '__version__', 'unknown'))

          assert platform.machine() in ('aarch64', 'arm64'), platform.machine()
          assert torch.cuda.is_available() is False, 'CPU-only image should not detect CUDA'
          print('ARM64 CPU-only smoke test: OK')
          PY

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
