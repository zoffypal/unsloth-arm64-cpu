name: Build Unsloth ARM64 CPU

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/unsloth-arm64
  VERSION: "2026.9.11"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # ---------------------------------------------------
      # Docker Buildx
      # ---------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # Build ARM64 image locally
      # ---------------------------------------------------

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64

          load: true
          push: false

          tags: |
            ${{ env.IMAGE }}:test
            ${{ env.IMAGE }}:${{ env.VERSION }}-cpu

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------
      # Architecture test
      # ---------------------------------------------------

      - name: Verify ARM64
        run: |
          set -eux

          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE}:test" \
            -lc 'uname -m'

      # ---------------------------------------------------
      # Python test
      # ---------------------------------------------------

      - name: Verify Python
        run: |
          set -eux

          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE}:test" \
            -lc '
              /opt/unsloth-studio/unsloth_studio/bin/python --version
            '

      # ---------------------------------------------------
      # CPU PyTorch test
      # ---------------------------------------------------

      - name: Verify CPU PyTorch
        run: |
          set -eux

          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE}:test" \
            -lc '
              /opt/unsloth-studio/unsloth_studio/bin/python - <<'"'"'PY'"'"'
              import torch

              print("torch:", torch.__version__)
              print("cuda:", torch.version.cuda)
              print("cuda available:", torch.cuda.is_available())

              assert torch.cuda.is_available() is False
              print("CPU-only PyTorch: OK")
              PY
            '

      # ---------------------------------------------------
      # Studio dependency test
      # ---------------------------------------------------

      - name: Verify Studio
        run: |
          set -eux

          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE}:test" \
            -lc '
              /opt/unsloth-studio/unsloth_studio/bin/python - <<'"'"'PY'"'"'

              import unsloth
              import structlog
              import fastapi
              import uvicorn
              import pydantic
              import pandas
              import matplotlib
              import gguf
              import av

              print("Unsloth:", getattr(unsloth, "__version__", "unknown"))
              print("Studio dependencies: OK")

              PY
            '

      # ---------------------------------------------------
      # llama.cpp
      # ---------------------------------------------------

      - name: Verify llama.cpp
        run: |
          set -eux

          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE}:test" \
            -lc '
              if [ -x /opt/unsloth-studio/llama.cpp/llama-server ]; then
                /opt/unsloth-studio/llama.cpp/llama-server --version
              elif command -v llama-server >/dev/null 2>&1; then
                llama-server --version
              else
                echo "llama-server not found"
                exit 1
              fi
            '

      # ---------------------------------------------------
      # Start Studio
      # ---------------------------------------------------

      - name: Start Studio
        run: |
          set -eux

          docker run -d \
            --name unsloth-test \
            -p 8000:8000 \
            -e UNSLOTH_STUDIO_PASSWORD="test-password-123" \
            "${IMAGE}:test"

          echo "Waiting for Studio..."

          for i in $(seq 1 90); do

            if curl -fsS \
              http://127.0.0.1:8000/ \
              >/dev/null 2>&1
            then
              echo "Studio is ready"
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "Studio failed to start"
              docker logs unsloth-test
              exit 1
            fi

            sleep 2

          done

          curl -f \
            http://127.0.0.1:8000/

          docker logs unsloth-test --tail 100

      # ---------------------------------------------------
      # Login GHCR
      # ---------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # Push
      # ---------------------------------------------------

      - name: Push image
        run: |
          set -eux

          docker tag \
            "${IMAGE}:test" \
            "${IMAGE}:latest"

          docker tag \
            "${IMAGE}:test" \
            "${IMAGE}:${VERSION}-cpu"

          docker push \
            "${IMAGE}:latest"

          docker push \
            "${IMAGE}:${VERSION}-cpu"
